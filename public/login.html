<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso del personal · Dérmica</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/api.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <header class="bar wrap">
    <a class="brand" href="index.html">Dérmica<span>Clínica dermatológica</span></a>
    <a class="staff" href="index.html">← Volver al inicio</a>
  </header>
  <main class="login wrap">
    <div class="login-image" aria-hidden="true"></div>
    <div class="login-inner">
      <p class="eyebrow">Acceso del personal</p>
      <h1 id="heading">Iniciar sesión</h1>
      <p id="description">Introduce tus credenciales de la clínica.</p>
      <form id="login" method="post" action="/api/auth/login">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="nombre@clinica.com" required>
        <label for="password">Contraseña</label>
        <div class="password">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" id="reveal" aria-controls="password">Mostrar</button>
        </div>
        <button class="button" type="submit">Iniciar sesión <span aria-hidden="true">→</span></button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <template id="prueba"></template>
    </div>
  </main>
</body>
</html>
